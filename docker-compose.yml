# Reference compose file for a non-Unraid deployment (e.g. plain Docker
# Compose on another host). If you're using Unraid's GUI directly instead,
# you don't need this file at all — just the single auto-pixai container,
# with ANDROID_ADB_HOST/ANDROID_ADB_PORT pointed at your Android device.
#
# There is no emulator service here — this connects to a real Android
# device (e.g. a Galaxy XCover 5) on your LAN over ADB. See readme.md for
# the phone-side pairing steps.
services:
  auto-pixai:
    build: .
    container_name: auto-pixai
    environment:
      - ANDROID_ADB_HOST=192.168.1.50  # replace with your device's reserved LAN IP
      - ANDROID_ADB_PORT=5555
      - DATA_PATH=/data/
      - PORT=8080
      # - TZ=Europe/London
      # - PUSHOVER_USER_KEY=
      # - PUSHOVER_APP_TOKEN=
      # - NOTIFY_ON_SUCCESS=false
      # - DEBUG_SCREENSHOTS=true
      # - DEFAULT_CRON=0 9 * * *
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
